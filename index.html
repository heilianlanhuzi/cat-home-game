<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐱 小猫回家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      overflow: hidden; touch-action: none;
    }
    #gameContainer {
      position: relative; width: 800px; height: 450px;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
      border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    #gameCanvas { display: block; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; z-index: 10; pointer-events: none;
    }
    .ui-panel {
      background: rgba(255,255,255,0.9); border-radius: 20px;
      padding: 8px 16px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    #scoreDisplay { font-size: 18px; font-weight: bold; color: #FF6B6B; }
    #heartsDisplay { font-size: 20px; }
    #levelDisplay { font-size: 16px; font-weight: bold; color: #4ECDC4; }
    #powerupBar {
      position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; pointer-events: none;
    }
    .powerup-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; background: rgba(255,255,255,0.9);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); opacity: 0.3; transition: all 0.3s;
    }
    .powerup-icon.active { opacity: 1; animation: powerupPulse 0.5s ease-in-out infinite; }
    @keyframes powerupPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    #keyProgress {
      position: absolute; top: 55px; right: 20px;
      background: rgba(255,255,255,0.9); border-radius: 20px;
      padding: 8px 16px; font-size: 18px; font-weight: bold;
      color: #FFD93D; z-index: 10; pointer-events: none; display: none;
    }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 20;
      color: #fff; text-align: center;
    }
    .screen h1 { font-size: 42px; margin-bottom: 16px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
    .screen h1 span { font-size: 56px; }
    .screen p { font-size: 16px; margin-bottom: 12px; color: #ddd; line-height: 1.6; }
    .screen .subtitle { font-size: 14px; color: #aaa; margin-bottom: 30px; }
    .btn {
      padding: 14px 50px; font-size: 20px;
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
      color: #fff; border: none; border-radius: 30px; cursor: pointer;
      font-family: inherit; transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(255,107,107,0.4); margin: 8px;
    }
    .btn:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(255,107,107,0.6); }
    .btn:active { transform: scale(0.95); }
    .btn-secondary {
      background: linear-gradient(135deg, #4ECDC4 0%, #6EE7DE 100%);
      box-shadow: 0 6px 20px rgba(78,205,196,0.4);
    }
    .hidden { display: none !important; }
    #mobileControls {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: none; justify-content: space-between; padding: 0 30px;
      z-index: 15; pointer-events: none;
    }
    .controlBtn {
      width: 70px; height: 70px; background: rgba(255,255,255,0.4);
      border: 3px solid rgba(255,255,255,0.8); border-radius: 50%;
      color: #fff; font-size: 32px; display: flex; justify-content: center;
      align-items: center; cursor: pointer; user-select: none;
      pointer-events: auto; backdrop-filter: blur(10px); transition: all 0.15s;
    }
    .controlBtn:active { background: rgba(255,255,255,0.7); transform: scale(0.9); }
    @media (max-width: 900px) {
      #gameContainer { width: 100vw; height: 56.25vw; border-radius: 0; }
      #mobileControls { display: flex; }
    }
    #comboDisplay {
      position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
      font-size: 28px; font-weight: bold; color: #FFD93D;
      text-shadow: 0 0 15px rgba(255,217,61,0.8); z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    #comboDisplay.show { opacity: 1; animation: comboPop 0.3s ease-out; }
    @keyframes comboPop {
      0% { transform: translateX(-50%) scale(0.8); }
      50% { transform: translateX(-50%) scale(1.3); }
      100% { transform: translateX(-50%) scale(1); }
    }
    .floatScore {
      position: absolute; font-size: 22px; font-weight: bold;
      color: #FFD93D; text-shadow: 0 0 8px rgba(255,217,61,0.8);
      pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 10;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    .damageText {
      position: absolute; font-size: 24px; font-weight: bold;
      color: #FF4757; text-shadow: 0 0 10px rgba(255,71,87,0.8);
      pointer-events: none; animation: damageFloat 0.8s ease-out forwards; z-index: 10;
    }
    @keyframes damageFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
    }
    .messageText {
      position: absolute; font-size: 28px; font-weight: bold;
      color: #fff; text-shadow: 0 0 15px rgba(0,0,0,0.5);
      pointer-events: none; animation: messageFade 2s ease-out forwards;
      z-index: 10; left: 50%; transform: translateX(-50%);
    }
    @keyframes messageFade {
      0% { opacity: 1; top: 40%; }
      100% { opacity: 0; top: 35%; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="ui">
      <div class="ui-panel"><span id="levelDisplay">🏠 1/5</span></div>
      <div class="ui-panel"><span id="heartsDisplay">❤️❤️❤️</span></div>
      <div class="ui-panel"><span id="scoreDisplay">🐟 0</span></div>
    </div>
    <div id="powerupBar">
      <div class="powerup-icon" id="umbrellaIcon">☂️</div>
      <div class="powerup-icon" id="bootsIcon">👢</div>
      <div class="powerup-icon" id="magnetIcon">🧲</div>
      <div class="powerup-icon" id="speedIcon">⚡</div>
    </div>
    <div id="keyProgress">🔑 0/3</div>
    <div id="comboDisplay">🔥 Combo x2!</div>
    <div id="startScreen" class="screen">
      <h1><span>🐱</span> 小猫回家</h1>
      <p class="subtitle">下雨天，小猫咪要赶回家～</p>
      <p>🌧️ 躲避雨滴 | 🐟 收集小鱼干 | ☂️ 捡道具 | 🏠 到达房子</p>
      <p style="margin-top:15px;font-size:14px;color:#888;">💻 键盘 ← → | 📱 点击左右按钮</p>
      <button class="btn" id="startBtn">开始游戏</button>
      <div id="continueContainer" class="hidden" style="margin-top:10px;">
        <button class="btn btn-secondary" id="continueBtn">继续第 X 关</button>
      </div>
      <div style="margin-top:20px;font-size:13px;color:#666;">
        最高分：<span id="highScoreDisplay">0</span> | 最高关卡：<span id="maxLevelDisplay">1</span>
      </div>
    </div>
    <div id="gameOverScreen" class="screen hidden">
      <h1><span>😿</span> 哎呀！</h1>
      <p id="deathReason">被雨滴淋湿了～</p>
      <p style="margin-top:15px;font-size:14px;">本关得分：<span id="levelScore" style="color:#FFD93D;">0</span></p>
      <button class="btn" id="retryBtn">再试一次</button>
      <button class="btn btn-secondary" id="restartBtn">重新开始</button>
    </div>
    <div id="winScreen" class="screen hidden">
      <h1><span>🎉</span> 到家啦！</h1>
      <p>小猫咪安全回家了～</p>
      <p style="margin-top:15px;font-size:14px;">本关得分：<span id="winLevelScore" style="color:#FFD93D;">0</span></p>
      <button class="btn" id="nextLevelBtn">下一关</button>
    </div>
    <div id="allClearScreen" class="screen hidden">
      <h1><span>🏆</span> 恭喜通关！</h1>
      <p>小猫咪成功回到了温暖的家！</p>
      <p style="margin-top:15px;font-size:16px;color:#FFD93D;">总分：<span id="finalScore">0</span></p>
      <p style="font-size:14px;color:#aaa;margin-top:10px;">最高分：<span id="finalHighScore">0</span></p>
      <button class="btn" id="playAgainBtn">再玩一次</button>
    </div>
    <div id="mobileControls">
      <div class="controlBtn" id="leftBtn">◀</div>
      <div class="controlBtn" id="rightBtn">▶</div>
    </div>
  </div>
  <script>
    const CONFIG = {
      playerSpeed: 7, playerWidth: 50, playerHeight: 60,
      rainBaseSpeed: 4, rainSpeedIncrease: 1, rainSpawnRate: 35,
      fishSpawnRate: 100, powerupSpawnRate: 400, lightningSpawnRate: 500,
      bombSpawnRate: 600, doorWidth: 70, doorHeight: 90, maxHearts: 3,
      colors: {
        cat: ['#FFA726', '#FFFFFF', '#424242'], rain: '#4FC3F7', fish: '#FFD93D',
        puddle: '#5C6BC0', house: '#FF8A65', houseLight: '#FFE082',
        umbrella: '#FF6B6B', boots: '#4ECDC4', magnet: '#A78BFA', speed: '#FBBF24',
        lightning: '#FCD34D', bomb: '#EF4444', key: '#FFD93D'
      }
    };
    const LEVELS = [
      { name: '小雨', rainSpeed: 4, rainRate: 45, fishRate: 120, puddles: 0, puddleTrigger: 0, lightning: false, bombs: false, tornadoes: false, fakeDoor: false, keys: 0, dark: false },
      { name: '水坑', rainSpeed: 5, rainRate: 38, fishRate: 100, puddles: 3, puddleTrigger: 400, lightning: false, bombs: false, tornadoes: false, fakeDoor: false, keys: 0, dark: false },
      { name: '骗局', rainSpeed: 6, rainRate: 32, fishRate: 90, puddles: 0, puddleTrigger: 0, lightning: true, bombs: false, tornadoes: false, fakeDoor: true, keys: 0, dark: false },
      { name: '暴雨', rainSpeed: 7, rainRate: 26, fishRate: 80, puddles: 3, puddleTrigger: 0, lightning: true, bombs: true, tornadoes: true, fakeDoor: false, keys: 0, dark: false },
      { name: '钥匙', rainSpeed: 8, rainRate: 22, fishRate: 70, puddles: 4, puddleTrigger: 0, lightning: true, bombs: true, tornadoes: true, fakeDoor: false, keys: 3, dark: true }
    ];
    let canvas, ctx, gameState = 'start', currentLevel = 1, frames = 0, score = 0, levelScore = 0, combo = 0, comboTimer = 0, hearts = 3;
    let player, rains = [], fishes = [], puddles = [], house = null, powerups = [], lightnings = [], bombs = [], tornadoes = [], keys = [];
    let keysCollected = 0, doorUnlocked = false, puddleTriggered = false, fakeDoorShown = false, realDoorPos = 0;
    let audioCtx, catType = 0, invincible = false, invincibleTimer = 0, wetEffect = false, wetTimer = 0;
    let activePowerups = { umbrella: false, boots: false, magnet: false, speed: false };
    let powerupTimers = { umbrella: 0, boots: 0, magnet: 0, speed: 0 };
    let saveData = { highScore: 0, maxLevel: 1, continueLevel: 1 };
    function loadSave() { const s = localStorage.getItem('catHomeSave'); if (s) saveData = JSON.parse(s); }
    function saveGame() {
      saveData.highScore = Math.max(saveData.highScore, score);
      saveData.maxLevel = Math.max(saveData.maxLevel, currentLevel);
      saveData.continueLevel = currentLevel;
      localStorage.setItem('catHomeSave', JSON.stringify(saveData));
    }
    function clearSave() { localStorage.removeItem('catHomeSave'); saveData = { highScore: 0, maxLevel: 1, continueLevel: 1 }; }
    window.onload = () => {
      canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
      loadSave(); updateSaveDisplay();
      document.getElementById('startBtn').onclick = startGame;
      document.getElementById('continueBtn').onclick = continueGame;
      document.getElementById('retryBtn').onclick = retryLevel;
      document.getElementById('restartBtn').onclick = restartGame;
      document.getElementById('nextLevelBtn').onclick = nextLevel;
      document.getElementById('playAgainBtn').onclick = playAgain;
      document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true; });
      document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false; });
      const leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn');
      leftBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
      leftBtn.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
      rightBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
      rightBtn.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });
      leftBtn.onmousedown = () => keys.left = true; leftBtn.onmouseup = () => keys.left = false;
      rightBtn.onmousedown = () => keys.right = true; rightBtn.onmouseup = () => keys.right = false;
      requestAnimationFrame(gameLoop);
    };
    function updateSaveDisplay() {
      document.getElementById('highScoreDisplay').textContent = saveData.highScore;
      document.getElementById('maxLevelDisplay').textContent = saveData.maxLevel;
      if (saveData.continueLevel > 1) {
        document.getElementById('continueContainer').classList.remove('hidden');
        document.getElementById('continueBtn').textContent = `继续第 ${saveData.continueLevel} 关`;
      }
    }
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      switch(type) {
        case 'fish': osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1100, now + 0.05); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); break;
        case 'powerup': osc.type = 'sine'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1); osc.frequency.setValueAtTime(784, now + 0.2); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
        case 'hit': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.2); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); break;
        case 'win': osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(now); osc.stop(now + 0.5); break;
        case 'puddle': osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.15); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15); break;
        case 'explode': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.4); gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
        case 'key': osc.type = 'sine'; osc.frequency.setValueAtTime(659, now); osc.frequency.setValueAtTime(784, now + 0.1); osc.frequency.setValueAtTime(988, now + 0.2); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
        case 'fake': osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
        case 'appear': osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(880, now + 0.2); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
      }
    }
    function initLevel(level) {
      const cfg = LEVELS[level - 1];
      if (level === 1) catType = Math.floor(Math.random() * CONFIG.colors.cat.length);
      player = { x: 50, y: canvas.height - 100, width: CONFIG.playerWidth, height: CONFIG.playerHeight, slowed: false };
      house = { x: canvas.width - 100, y: canvas.height - 100, width: CONFIG.doorWidth, height: CONFIG.doorHeight, visible: true };
      realDoorPos = 100;
      puddles = []; rains = []; fishes = []; powerups = []; lightnings = []; bombs = []; tornadoes = []; keys = [];
      frames = 0; levelScore = 0; combo = 0; keysCollected = 0; doorUnlocked = false; puddleTriggered = false; fakeDoorShown = false;
      if (cfg.puddleTrigger > 0) {
        for (let i = 0; i < cfg.puddles; i++) {
          puddles.push({ x: canvas.width - 250 + i * 70, y: canvas.height - 40, width: 60, height: 25, hidden: true });
        }
      } else {
        for (let i = 0; i < cfg.puddles; i++) {
          puddles.push({ x: 150 + Math.random() * (canvas.width - 300), y: canvas.height - 40, width: 70, height: 25, hidden: false });
        }
      }
      if (cfg.fakeDoor) {
        house.visible = true;
        house.isFake = true;
      }
      if (cfg.keys > 0) {
        document.getElementById('keyProgress').style.display = 'block';
        document.getElementById('keyProgress').textContent = `🔑 0/${cfg.keys}`;
        const keyPositions = [100, 400, 700];
        for (let i = 0; i < cfg.keys; i++) {
          keys.push({ x: keyPositions[i], y: 80 + i * 60, width: 30, height: 30, collected: false, visible: false });
        }
        setTimeout(() => {
          keys.forEach((k, i) => {
            setTimeout(() => { k.visible = true; playSound('powerup'); }, i * 500);
          });
        }, 2000);
      } else {
        document.getElementById('keyProgress').style.display = 'none';
      }
      activePowerups = { umbrella: false, boots: false, magnet: false, speed: false };
      powerupTimers = { umbrella: 0, boots: 0, magnet: 0, speed: 0 };
      updatePowerupIcons();
    }
    function startGame() {
      initAudio(); gameState = 'playing'; currentLevel = 1; score = 0; hearts = CONFIG.maxHearts;
      catType = Math.floor(Math.random() * CONFIG.colors.cat.length);
      initLevel(currentLevel);
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('winScreen').classList.add('hidden');
      document.getElementById('allClearScreen').classList.add('hidden');
      updateUI();
    }
    function continueGame() {
      initAudio(); gameState = 'playing'; currentLevel = saveData.continueLevel; score = 0; hearts = CONFIG.maxHearts;
      catType = Math.floor(Math.random() * CONFIG.colors.cat.length);
      initLevel(currentLevel);
      document.getElementById('startScreen').classList.add('hidden');
      updateUI();
    }
    function retryLevel() {
      gameState = 'playing'; hearts = CONFIG.maxHearts; levelScore = 0; combo = 0; invincible = false; wetEffect = false;
      initLevel(currentLevel);
      document.getElementById('gameOverScreen').classList.add('hidden');
      updateUI();
    }
    function restartGame() {
      gameState = 'playing'; currentLevel = 1; score = 0; hearts = CONFIG.maxHearts; levelScore = 0; combo = 0; invincible = false; wetEffect = false;
      initLevel(currentLevel);
      document.getElementById('gameOverScreen').classList.add('hidden');
      updateUI();
    }
    function nextLevel() {
      currentLevel++;
      if (currentLevel > LEVELS.length) { allClear(); return; }
      gameState = 'playing'; hearts = CONFIG.maxHearts; levelScore = 0; combo = 0; invincible = false; wetEffect = false;
      initLevel(currentLevel);
      document.getElementById('winScreen').classList.add('hidden');
      updateUI();
    }
    function playAgain() { clearSave(); startGame(); }
    function allClear() {
      gameState = 'allclear'; saveGame();
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalHighScore').textContent = Math.max(saveData.highScore, score);
      document.getElementById('allClearScreen').classList.remove('hidden');
    }
    function gameOver() {
      gameState = 'gameover'; playSound('hit'); saveGame();
      document.getElementById('levelScore').textContent = levelScore;
      document.getElementById('gameOverScreen').classList.remove('hidden');
      updateSaveDisplay();
    }
    function winLevel() {
      gameState = 'win'; playSound('win'); score += levelScore; score += hearts * 100; saveGame();
      document.getElementById('winLevelScore').textContent = levelScore;
      document.getElementById('winScreen').classList.remove('hidden');
    }
    function updateUI() {
      const cfg = LEVELS[currentLevel - 1];
      document.getElementById('levelDisplay').textContent = `🏠 ${currentLevel}/5 ${cfg.name}`;
      document.getElementById('heartsDisplay').textContent = '❤️'.repeat(hearts);
      document.getElementById('scoreDisplay').textContent = `🐟 ${score}`;
    }
    function updatePowerupIcons() {
      document.getElementById('umbrellaIcon').classList.toggle('active', activePowerups.umbrella);
      document.getElementById('bootsIcon').classList.toggle('active', activePowerups.boots);
      document.getElementById('magnetIcon').classList.toggle('active', activePowerups.magnet);
      document.getElementById('speedIcon').classList.toggle('active', activePowerups.speed);
    }
    function showCombo() {
      if (combo >= 3) {
        const el = document.getElementById('comboDisplay');
        el.textContent = `🔥 Combo x${combo}!`; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 800);
      }
    }
    function showFloatScore(x, y, text) {
      const el = document.createElement('div'); el.className = 'floatScore'; el.textContent = text;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      document.getElementById('gameContainer').appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
    function showDamageText(x, y, text) {
      const el = document.createElement('div'); el.className = 'damageText'; el.textContent = text;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      document.getElementById('gameContainer').appendChild(el);
      setTimeout(() => el.remove(), 800);
    }
    function showMessage(text) {
      const el = document.createElement('div'); el.className = 'messageText'; el.textContent = text;
      document.getElementById('gameContainer').appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
    function update() {
      if (gameState !== 'playing') return;
      frames++;
      const cfg = LEVELS[currentLevel - 1];
      for (const [k, v] of Object.entries(powerupTimers)) {
        if (v > 0) { powerupTimers[k]--; if (powerupTimers[k] <= 0) activePowerups[k] = false; }
      }
      updatePowerupIcons();
      let speed = activePowerups.speed ? CONFIG.playerSpeed * 1.8 : CONFIG.playerSpeed;
      if (player.slowed && !activePowerups.boots) { speed = CONFIG.playerSpeed * 0.5; if (frames % 10 === 0) player.slowed = false; }
      if (keys.left) player.x -= speed;
      if (keys.right) player.x += speed;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      if (cfg.puddleTrigger > 0 && !puddleTriggered && player.x >= cfg.puddleTrigger) {
        puddleTriggered = true;
        puddles.forEach(p => p.hidden = false);
        showMessage('💧 小心水坑！');
        const bootsDrop = { x: player.x + 50, y: 50, width: 35, height: 35, type: 'boots', speed: 2, forced: true };
        powerups.push(bootsDrop);
      }
      if (cfg.fakeDoor && !fakeDoorShown && player.x >= canvas.width - 150) {
        fakeDoorShown = true;
        playSound('fake');
        showMessage('🚪 这是假门！');
        house.visible = false;
        setTimeout(() => {
          house.x = realDoorPos;
          house.visible = true;
          house.isFake = false;
          playSound('appear');
          showMessage('🏠 真门在这！');
        }, 1000);
      }
      if (frames % cfg.rainRate === 0) {
        rains.push({ x: Math.random() * canvas.width, y: -20, width: 5 + Math.random() * 5, height: 20 + Math.random() * 15, speed: cfg.rainSpeed + Math.random() * 2 });
      }
      if (frames % cfg.fishRate === 0) {
        fishes.push({ x: 30 + Math.random() * (canvas.width - 60), y: -20, width: 35, height: 25, speed: 2.5 });
      }
      if (frames % CONFIG.powerupSpawnRate === 0 && Math.random() < 0.4) {
        const types = ['umbrella', 'boots', 'magnet', 'speed'];
        powerups.push({ x: 50 + Math.random() * (canvas.width - 100), y: -30, width: 35, height: 35, type: types[Math.floor(Math.random() * types.length)], speed: 2, forced: false });
      }
      if (cfg.lightning && frames % CONFIG.lightningSpawnRate === 0) {
        lightnings.push({ x: Math.random() * canvas.width, y: -50, width: 40, height: 100, warnTime: 60, active: false });
      }
      if (cfg.bombs && frames % CONFIG.bombSpawnRate === 0) {
        bombs.push({ x: Math.random() * canvas.width, y: -30, width: 30, height: 30, speed: 3, exploded: false });
      }
      if (cfg.tornadoes && frames % 800 === 0 && Math.random() < 0.5) {
        tornadoes.push({ x: canvas.width + 50, y: 100 + Math.random() * 200, width: 60, height: 150, speed: 3 });
      }
      for (let i = rains.length - 1; i >= 0; i--) { rains[i].y += rains[i].speed; if (rains[i].y > canvas.height) rains.splice(i, 1); }
      for (let i = fishes.length - 1; i >= 0; i--) {
        if (activePowerups.magnet) {
          const dx = (player.x + player.width/2) - (fishes[i].x + fishes[i].width/2);
          const dy = (player.y + player.height/2) - (fishes[i].y + fishes[i].height/2);
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) { fishes[i].x += dx * 0.08; fishes[i].y += dy * 0.08; }
        }
        fishes[i].y += fishes[i].speed;
        if (fishes[i].y > canvas.height) fishes.splice(i, 1);
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        powerups[i].y += powerups[i].speed;
        if (powerups[i].y > canvas.height && !powerups[i].forced) powerups.splice(i, 1);
      }
      for (let i = lightnings.length - 1; i >= 0; i--) {
        lightnings[i].warnTime--;
        if (lightnings[i].warnTime <= 0) { lightnings[i].active = true; lightnings[i].y += 15; }
        if (lightnings[i].y > canvas.height) lightnings.splice(i, 1);
      }
      for (let i = bombs.length - 1; i >= 0; i--) {
        bombs[i].y += bombs[i].speed;
        if (bombs[i].y > canvas.height && !bombs[i].exploded) { bombs[i].exploded = true; bombs[i].explosionFrame = 30; playSound('explode'); }
        if (bombs[i].exploded) { bombs[i].explosionFrame--; if (bombs[i].explosionFrame <= 0) bombs.splice(i, 1); }
      }
      for (let i = tornadoes.length - 1; i >= 0; i--) {
        tornadoes[i].x -= tornadoes[i].speed;
        if (tornadoes[i].x < -100) tornadoes.splice(i, 1);
      }
      for (let i = keys.length - 1; i >= 0; i--) {
        if (!keys[i].collected && keys[i].visible) {
          const dx = (player.x + player.width/2) - (keys[i].x + keys[i].width/2);
          const dy = (player.y + player.height/2) - (keys[i].y + keys[i].height/2);
          keys[i].x += dx * 0.03; keys[i].y += dy * 0.03;
        }
      }
      if (invincible) { invincibleTimer--; if (invincibleTimer <= 0) invincible = false; }
      if (wetEffect) { wetTimer--; if (wetTimer <= 0) wetEffect = false; }
      if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 0; }
      if (!invincible && !activePowerups.umbrella) {
        for (const rain of rains) {
          if (checkCollision(player, rain)) {
            hearts--; invincible = true; invincibleTimer = 60; wetEffect = true; wetTimer = 120;
            playSound('hit'); showDamageText(player.x, player.y, '-1❤️'); combo = 0; updateUI();
            if (hearts <= 0) { gameOver(); return; }
            break;
          }
        }
      }
      for (let i = fishes.length - 1; i >= 0; i--) {
        if (checkCollision(player, fishes[i])) {
          combo++; comboTimer = 120;
          const mult = Math.min(combo, 5);
          const fs = 10 * mult;
          levelScore += fs;
          showFloatScore(fishes[i].x, fishes[i].y, `+${fs}`);
          playSound('fish'); showCombo();
          fishes.splice(i, 1); updateUI();
        }
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        if (checkCollision(player, powerups[i])) {
          const t = powerups[i].type;
          activePowerups[t] = true;
          const durations = { umbrella: 300, boots: 600, magnet: 480, speed: 300 };
          powerupTimers[t] = durations[t];
          playSound('powerup');
          showFloatScore(powerups[i].x, powerups[i].y, getPowerupText(t));
          powerups.splice(i, 1);
        }
      }
      if (!invincible && !activePowerups.umbrella) {
        for (const l of lightnings) {
          if (l.active && checkCollision(player, l)) {
            hearts--; invincible = true; invincibleTimer = 60; wetEffect = true; wetTimer = 120;
            playSound('hit'); showDamageText(player.x, player.y, '⚡-1❤️'); combo = 0; updateUI();
            if (hearts <= 0) { gameOver(); return; }
            break;
          }
        }
      }
      for (const b of bombs) {
        if (b.exploded && b.explosionFrame > 15) {
          const dx = (player.x + player.width/2) - (b.x + b.width/2);
          const dy = (player.y + player.height/2) - (b.y + b.height/2);
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 80 && !invincible && !activePowerups.umbrella) {
            hearts--; invincible = true; invincibleTimer = 60; wetEffect = true; wetTimer = 120;
            playSound('hit'); showDamageText(player.x, player.y, '💥-1❤️'); combo = 0; updateUI();
            if (hearts <= 0) { gameOver(); return; }
          }
        }
      }
      for (const t of tornadoes) {
        const dx = (player.x + player.width/2) - (t.x + t.width/2);
        const dy = (player.y + player.height/2) - (t.y + t.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) { player.x -= 2; }
      }
      for (const p of puddles) {
        if (!p.hidden && checkCollision(player, p) && !activePowerups.boots) { player.slowed = true; if (frames % 30 === 0) playSound('puddle'); }
      }
      for (let i = keys.length - 1; i >= 0; i--) {
        if (!keys[i].collected && keys[i].visible && checkCollision(player, keys[i])) {
          keys[i].collected = true;
          keysCollected++;
          playSound('key');
          showFloatScore(keys[i].x, keys[i].y, '🔑 +1');
          document.getElementById('keyProgress').textContent = `🔑 ${keysCollected}/${cfg.keys}`;
          if (keysCollected >= cfg.keys) {
            doorUnlocked = true;
            showMessage('🚪 门打开了！');
            house.x = realDoorPos;
          }
        }
      }
      const targetDoorX = cfg.keys > 0 ? (doorUnlocked ? realDoorPos : canvas.width - 100) : (cfg.fakeDoor ? (fakeDoorShown ? realDoorPos : canvas.width - 100) : house.x);
      const targetDoor = { x: targetDoorX, y: house.y, width: house.width, height: house.height };
      if (house.visible && checkCollision(player, targetDoor)) {
        if (cfg.keys > 0 && !doorUnlocked) {
          showMessage('🔒 需要钥匙！');
        } else {
          winLevel(); return;
        }
      }
    }
    function getPowerupText(t) { return { umbrella: '☂️无敌!', boots: '👢防水!', magnet: '🧲吸附!', speed: '⚡加速!' }[t]; }
    function checkCollision(r1, r2) { return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y; }
    function draw() {
      const cfg = LEVELS[currentLevel - 1];
      if (cfg.dark) {
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 80; i++) { const x = (i * 37) % canvas.width, y = (i * 23) % (canvas.height - 100); ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2); ctx.fill(); }
        const gradient = ctx.createRadialGradient(player.x + player.width/2, player.y + player.height/2, 30, player.x + player.width/2, player.y + player.height/2, 150);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = cfg.rainRate < 35 ? '#87CEEB' : '#5C7C8A'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.strokeStyle = cfg.dark ? 'rgba(255,255,255,0.1)' : 'rgba(79,195,247,0.2)'; ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      if (gameState === 'start') return;
      ctx.fillStyle = '#4A5568'; ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
      for (const p of puddles) { if (!p.hidden) { ctx.fillStyle = CONFIG.colors.puddle; ctx.beginPath(); ctx.ellipse(p.x + p.width/2, p.y + p.height/2, p.width/2, p.height/2, 0, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke(); } }
      if (house.visible) drawHouse();
      drawCat();
      for (const r of rains) drawRain(r);
      for (const f of fishes) drawFish(f);
      for (const p of powerups) drawPowerup(p);
      for (const l of lightnings) drawLightning(l);
      for (const b of bombs) drawBomb(b);
      for (const t of tornadoes) drawTornado(t);
      for (const k of keys) { if (!k.collected && k.visible) drawKey(k); }
    }
    function drawCat() {
      const x = player.x, y = player.y, color = CONFIG.colors.cat[catType];
      if (invincible && Math.floor(frames / 4) % 2 === 0) return;
      if (wetEffect) { ctx.globalAlpha = 0.8; ctx.fillStyle = 'rgba(79,195,247,0.3)'; ctx.beginPath(); ctx.ellipse(x + 25, y + 30, 22, 26, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x + 25, y + 35, 20, 25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 25, y + 18, 18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 10, y + 8); ctx.lineTo(x + 4, y - 8); ctx.lineTo(x + 18, y + 5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 40, y + 8); ctx.lineTo(x + 46, y - 8); ctx.lineTo(x + 32, y + 5); ctx.fill();
      ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(x + 18, y + 15, 3.5, 0, Math.PI * 2); ctx.arc(x + 32, y + 15, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FF6B6B'; ctx.beginPath(); ctx.arc(x + 25, y + 22, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = color === '#FFFFFF' ? '#333' : '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + 10, y + 22); ctx.lineTo(x - 8, y + 20); ctx.moveTo(x + 10, y + 25); ctx.lineTo(x - 8, y + 27); ctx.moveTo(x + 40, y + 22); ctx.lineTo(x + 58, y + 20); ctx.moveTo(x + 40, y + 25); ctx.lineTo(x + 58, y + 27); ctx.stroke();
      const tailSwing = Math.sin(frames * 0.15) * 10;
      ctx.beginPath(); ctx.moveTo(x + 42, y + 40); ctx.quadraticCurveTo(x + 60 + tailSwing, y + 30, x + 58 + tailSwing, y + 18); ctx.strokeStyle = color; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();
      const legSwing = Math.sin(frames * 0.3) * 6;
      ctx.fillStyle = color; ctx.fillRect(x + 15, y + 55, 6, 10 + legSwing); ctx.fillRect(x + 29, y + 55, 6, 10 - legSwing);
      ctx.globalAlpha = 1;
    }
    function drawRain(r) { ctx.strokeStyle = CONFIG.colors.rain; ctx.lineWidth = r.width; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + 3, r.y + r.height); ctx.stroke(); }
    function drawFish(f) { ctx.shadowColor = CONFIG.colors.fish; ctx.shadowBlur = 12; ctx.fillStyle = CONFIG.colors.fish; ctx.beginPath(); ctx.ellipse(f.x + 17, f.y + 12, 14, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(f.x + 28, f.y + 12); ctx.lineTo(f.x + 40, f.y + 5); ctx.lineTo(f.x + 40, f.y + 19); ctx.fill(); ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(f.x + 10, f.y + 10, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
    function drawPowerup(p) { ctx.shadowColor = CONFIG.colors[p.type]; ctx.shadowBlur = 15; const icons = { umbrella: '☂️', boots: '👢', magnet: '🧲', speed: '⚡' }; const colors = { umbrella: '#FF6B6B', boots: '#4ECDC4', magnet: '#A78BFA', speed: '#FBBF24' }; ctx.fillStyle = colors[p.type]; ctx.beginPath(); ctx.arc(p.x + 17, p.y + 17, 18, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(icons[p.type], p.x + 17, p.y + 17); ctx.shadowBlur = 0; }
    function drawLightning(l) { if (l.warnTime > 0) { ctx.fillStyle = `rgba(252,211,77,${0.3 + Math.sin(frames * 0.5) * 0.2})`; ctx.fillRect(l.x, 0, l.width, canvas.height); ctx.fillStyle = '#FCD34D'; ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.fillText('⚠️', l.x + l.width/2, 30); } else { ctx.fillStyle = '#FCD34D'; ctx.shadowColor = '#FCD34D'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.moveTo(l.x + l.width/2, l.y); ctx.lineTo(l.x + l.width, l.y + 40); ctx.lineTo(l.x + l.width/3, l.y + 40); ctx.lineTo(l.x + l.width/2 + 10, l.y + l.height); ctx.lineTo(l.x, l.y + 40); ctx.lineTo(l.x + l.width*2/3, l.y + 40); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; } }
    function drawBomb(b) { if (!b.exploded) { ctx.fillStyle = CONFIG.colors.bomb; ctx.beginPath(); ctx.arc(b.x + 15, b.y + 15, 15, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x + 15, b.y + 5); ctx.lineTo(b.x + 20, b.y - 5); ctx.stroke(); ctx.fillStyle = '#FCD34D'; ctx.beginPath(); ctx.arc(b.x + 20, b.y - 8, 4 + Math.random() * 2, 0, Math.PI * 2); ctx.fill(); } else { const radius = 80 * (b.explosionFrame / 30); const gradient = ctx.createRadialGradient(b.x + 15, b.y + 15, 0, b.x + 15, b.y + 15, radius); gradient.addColorStop(0, 'rgba(255,255,255,0.9)'); gradient.addColorStop(0.3, 'rgba(255,100,50,0.7)'); gradient.addColorStop(0.6, 'rgba(255,50,0,0.4)'); gradient.addColorStop(1, 'rgba(255,0,0,0)'); ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(b.x + 15, b.y + 15, radius, 0, Math.PI * 2); ctx.fill(); } }
    function drawTornado(t) { ctx.fillStyle = 'rgba(150,150,200,0.4)'; ctx.beginPath(); for (let i = 0; i < t.height; i += 20) { const w = t.width * (1 - i / t.height); ctx.ellipse(t.x + i * 0.5, t.y + i, w/2, 10, 0, 0, Math.PI * 2); } ctx.fill(); ctx.strokeStyle = 'rgba(200,200,255,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < t.height; i += 20) { const w = t.width * (1 - i / t.height); ctx.ellipse(t.x + i * 0.5, t.y + i, w/2, 10, 0, 0, Math.PI * 2); } ctx.stroke(); }
    function drawKey(k) { ctx.shadowColor = CONFIG.colors.key; ctx.shadowBlur = 20; ctx.fillStyle = CONFIG.colors.key; ctx.beginPath(); ctx.arc(k.x + 15, k.y + 15, 12, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#B8860B'; ctx.beginPath(); ctx.arc(k.x + 15, k.y + 15, 8, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFD93D'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(k.x + 15, k.y + 5); ctx.lineTo(k.x + 15, k.y - 8); ctx.stroke(); ctx.shadowBlur = 0; }
    function drawHouse() {
      const x = house.x, y = house.y;
      if (currentLevel === 3 && house.isFake && !fakeDoorShown) {
        ctx.fillStyle = '#FF6B6B'; ctx.globalAlpha = 0.7;
      } else {
        ctx.fillStyle = CONFIG.colors.house;
      }
      ctx.fillRect(x, y + 25, house.width, house.height - 25);
      ctx.beginPath(); ctx.moveTo(x - 15, y + 25); ctx.lineTo(x + house.width/2, y - 15); ctx.lineTo(x + house.width + 15, y + 25); ctx.fill();
      ctx.fillStyle = '#8D6E63'; ctx.fillRect(x + 25, y + 45, 25, 45);
      ctx.fillStyle = CONFIG.colors.houseLight; ctx.fillRect(x + 8, y + 30, 15, 15); ctx.fillRect(x + house.width - 23, y + 30, 15, 15);
      ctx.fillStyle = '#5D4037'; ctx.fillRect(x + 40, y - 25, 15, 30);
      ctx.globalAlpha = 1;
    }
    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
  </script>
